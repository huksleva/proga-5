[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huksleva-openweather"
version = "0.1.0"
description = "A small typed OpenWeather API client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Leonid Tots"}]
dependencies = ["requests>=2.32,<3"]
keywords = ["weather", "openweather", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/huksleva/proga-5"
Issues = "https://github.com/huksleva/proga-5/issues"

[project.scripts]
huksleva-weather = "huksleva_openweather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
huksleva_openweather = ["py.typed"]
